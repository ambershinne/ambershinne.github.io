<script type="text/x-dc" data-dc-script data-props='{"cInk":{"editor":"color","default":"#11182F"},"cMuted":{"editor":"color","default":"#5B6475"},"cFrame":{"editor":"color","default":"#4E5768"},"cSurface":{"editor":"color","default":"#1E2A40"},"cAccent":{"editor":"color","default":"#92cbf3"}}'>
class Component extends DCLogic {

    ].map((g) => ({ ...g, items: g.items.map((t) => { const m = t.match(/^(.*?)\[(.+?)\](.*)$/); return m ? { a: m[1], h: m[2], b: m[3], hs: '100% 42%' } : { a: t, h: '', b: '', hs: '0 0' }; }) }));

      { cat: 'Design', name: 'Figma', note: 'Auto layout, variables, prototyping' },
      { cat: 'Design', name: 'Sketch', note: 'Symbol-based systems' },
      { cat: 'Graphics', name: 'Illustrator, Photoshop', note: 'Brand assets' },
      { cat: 'Prototyping', name: 'Framer, Claude Design', note: 'Interaction prototyping' },
      { cat: 'Handoff', name: 'Zeplin', note: 'Handoff & specs' },
      { cat: 'Docs & PM', name: 'Notion, Asana', note: 'Documentation & project management' },
      { cat: 'Development', name: 'HTML, CSS', note: 'GitHub deployment' }
    ];
    return {
      photos: photos.map((p, i) => {
        const a = (-36 + i * 18) * Math.PI / 180;
        const [rw, rh] = String(p.ratio).split('/').map(Number); const r = rw / rh;
        const hv = r > 1 ? { hw: '160px', hh: Math.round(160 / r) + 'px' } : { hw: Math.round(160 * r) + 'px', hh: '160px' };
        return { ...p, ...hv, title: titles[i], x: 'calc(50% + ' + Math.round(800 * Math.sin(a * 32 / 36)) + 'px)', y: Math.round(920 - 800 * Math.cos(a * 32 / 36)) + 'px' };
      }),
      strengths: strengths.map((s, i) => ({ ...s, hl: i < 2 ? '100% 42%' : '0 0', i0: i === 0, i1: i === 1, i2: i === 2, i3: i === 3, i4: i === 4 })),
      skills, career, tools,
      time: this.state.time,
      cInk: this.props.cInk, cMuted: this.props.cMuted, cFrame: this.props.cFrame, cSurface: this.props.cSurface, cAccent: this.props.cAccent
    };
  }
}
</script>
