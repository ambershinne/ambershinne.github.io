<body>
<div id="app"></div>
<!-- Page markup. {{ ... }} values come from renderVals() in the script below. -->
<template id="tpl">
<div class="hatch" onClick="{{ outside }}" style="--ink: {{ cInk }}; --muted: {{ cMuted }}; --frame: {{ cFrame }}; --surface: {{ cSurface }}; --accent: {{ cAccent }}; width: 100%; font-family: {{ sans }}; color: var(--ink); background-color: #FFFFFF">

<a href="#contact" style="display: block; background: var(--ink); color: #FFFFFF; text-align: center; padding: 12px 20px; font-size: 14px; text-decoration: none">Open to product design roles in Berlin. <span style="text-decoration: underline; text-underline-offset: 4px; color: #C9D3E3">Get in touch →</span></a>

<header style="border-bottom: 1px solid #E3E6EB; background: rgba(255,255,255,0.92); position: sticky; top: 0; z-index: 10; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px)">
<nav aria-label="Main" style="max-width: 1280px; margin: 0 auto; padding: 10px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-right: 20px; padding-left: 20px">
<a class="brand" href="#top" style="display: flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; color: var(--ink)"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24"><path class="m1" d="M2 12a8 8 0 0 1 16 0z" style="fill: var(--ink)"></path><path class="m2" d="M6 12a8 8 0 0 0 16 0z" style="fill: var(--accent)"></path></svg><span class="mono" style="font-size: 13px; font-weight: 500; letter-spacing: 0.18em">Amber Shin</span></a>
<div style="display: flex; align-items: center; gap: 4px"><a class="clink" href="#work">Work</a><a class="clink" href="about.html">About</a><div class="cwrap"><button type="button" class="ccta" aria-haspopup="true" aria-expanded="{{ cAria }}" onClick="{{ toggleContact }}">Contact <svg class="cchev" aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate({{ cRot }})"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-if value="{{ cOpen }}" hint-placeholder-val="{{ false }}"><div class="cmenu" role="menu"><span class="clbl">Get in touch</span><a class="cit" role="menuitem" href="mailto:seh3988@gmail.com"><span class="cic" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A4560" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3.5 6.5 8.5 6.5 8.5-6.5"></path></svg></span><span class="ctx"><span class="ct">Email</span><span class="cs">Drop me a line</span></span><span class="car"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A93A3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a><a class="cit" role="menuitem" href="https://www.linkedin.com/in/eunhyeshin" target="_blank" rel="noopener"><span class="cic" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A4560" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 10.5v6M8 7.5v.01M12 16.5v-3.5a2.5 2.5 0 0 1 5 0v3.5M12 10.5v6"></path></svg></span><span class="ctx"><span class="ct">LinkedIn</span><span class="cs">Let's connect</span></span><span class="car"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A93A3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"></path></svg></span></a><a class="cit" role="menuitem" href="assets/eunhye-amber-shin_CV_2026.pdf" target="_blank" rel="noopener"><span class="cic" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A4560" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5M9 13h6M9 17h4"></path></svg></span><span class="ctx"><span class="ct">Résumé</span><span class="cs">PDF · Updated 2026</span></span><span class="car"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A93A3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"></path></svg></span></a></div></sc-if></div></div>
</nav>
</header>

<main style="max-width: 1280px; margin: 0 auto; background: #FFFFFF; border-left: 1px dashed var(--frame); border-right: 1px dashed var(--frame)">

<section id="top" class="hero">

<sc-for list="{{ cells }}" as="cl" hint-placeholder-count="4">
<sc-if value="{{ cl.active }}" hint-placeholder-val="{{ false }}">
<button type="button" class="cell side on" aria-pressed="true" onClick="{{ cl.pick }}" style="grid-column: {{ cl.col }}; grid-row: {{ cl.row }}; position: relative; overflow: hidden; border: 0; border-bottom: 1px dashed #C3C9D3; border-right: {{ cl.bR }}; border-left: {{ cl.bL }}; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px var(--ink); padding: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; cursor: pointer; font-family: inherit; color: var(--ink)">
<span class="mono" style="font-size: 12px; position: relative; z-index: 1">{{ cl.num }}</span>
<span class="mono" style="font-size: 12px; line-height: 1.5; position: relative; z-index: 1">{{ cl.short }}</span>
<sc-if value="{{ cl.i_b2b }}" hint-placeholder-val="{{ false }}"><svg class="cart" aria-hidden="true" viewBox="0 0 96 72" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="92" height="68" rx="4"></rect><path d="M22 2v68M2 12h92M8 22h8M8 30h8M8 38h8"></path><rect x="32" y="44" width="8" height="18"></rect><rect x="46" y="34" width="8" height="28"></rect><rect x="60" y="24" width="8" height="38"></rect><rect x="74" y="38" width="8" height="24"></rect></svg></sc-if><sc-if value="{{ cl.i_mobile }}" hint-placeholder-val="{{ false }}"><svg class="cart" aria-hidden="true" viewBox="0 0 96 72" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="29" y="2" width="38" height="68" rx="7"></rect><path d="M42 7h12M35 20h26M35 28h20M35 36h26M35 44h16"></path><rect x="35" y="54" width="26" height="9" rx="4.5"></rect></svg></sc-if><sc-if value="{{ cl.i_admin }}" hint-placeholder-val="{{ false }}"><svg class="cart" aria-hidden="true" viewBox="0 0 96 72" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="92" height="60" rx="3"></rect><path d="M2 18h92M2 30h92M2 42h92M2 54h92M30 6v60M62 6v60"></path><rect x="9" y="22" width="5" height="5"></rect><rect x="9" y="34" width="5" height="5"></rect><rect x="9" y="46" width="5" height="5"></rect><path d="M10.5 36.5l1.2 1.2 2.4-2.6"></path></svg></sc-if><sc-if value="{{ cl.i_ai }}" hint-placeholder-val="{{ false }}"><svg class="cart" aria-hidden="true" viewBox="0 0 96 72" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M28 10c2 14 6 18 20 20-14 2-18 6-20 20-2-14-6-18-20-20 14-2 18-6 20-20z"></path><path d="M62 24l-9 10 9 10M80 24l9 10-9 10M74 20l-6 28"></path></svg></sc-if>
</button>
</sc-if>
<sc-if value="{{ cl.idle }}" hint-placeholder-val="{{ true }}">
<button type="button" class="cell side" aria-pressed="false" onClick="{{ cl.pick }}" style="grid-column: {{ cl.col }}; grid-row: {{ cl.row }}; position: relative; overflow: hidden; border: 0; border-bottom: 1px dashed #C3C9D3; border-right: {{ cl.bR }}; border-left: {{ cl.bL }}; background: #F8F9FB; padding: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; cursor: pointer; font-family: inherit; color: var(--muted)">
<span class="mono" style="font-size: 12px; position: relative; z-index: 1">{{ cl.num }}</span>
<span class="mono" style="font-size: 12px; line-height: 1.5; position: relative; z-index: 1">{{ cl.short }}</span>
<sc-if value="{{ cl.i_b2b }}" hint-placeholder-val="{{ false }}"><svg class="cart" aria-hidden="true" viewBox="0 0 96 72" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="92" height="68" rx="4"></rect><path d="M22 2v68M2 12h92M8 22h8M8 30h8M8 38h8"></path><rect x="32" y="44" width="8" height="18"></rect><rect x="46" y="34" width="8" height="28"></rect><rect x="60" y="24" width="8" height="38"></rect><rect x="74" y="38" width="8" height="24"></rect></svg></sc-if><sc-if value="{{ cl.i_mobile }}" hint-placeholder-val="{{ false }}"><svg class="cart" aria-hidden="true" viewBox="0 0 96 72" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="29" y="2" width="38" height="68" rx="7"></rect><path d="M42 7h12M35 20h26M35 28h20M35 36h26M35 44h16"></path><rect x="35" y="54" width="26" height="9" rx="4.5"></rect></svg></sc-if><sc-if value="{{ cl.i_admin }}" hint-placeholder-val="{{ false }}"><svg class="cart" aria-hidden="true" viewBox="0 0 96 72" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="92" height="60" rx="3"></rect><path d="M2 18h92M2 30h92M2 42h92M2 54h92M30 6v60M62 6v60"></path><rect x="9" y="22" width="5" height="5"></rect><rect x="9" y="34" width="5" height="5"></rect><rect x="9" y="46" width="5" height="5"></rect><path d="M10.5 36.5l1.2 1.2 2.4-2.6"></path></svg></sc-if><sc-if value="{{ cl.i_ai }}" hint-placeholder-val="{{ false }}"><svg class="cart" aria-hidden="true" viewBox="0 0 96 72" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M28 10c2 14 6 18 20 20-14 2-18 6-20 20-2-14-6-18-20-20 14-2 18-6 20-20z"></path><path d="M62 24l-9 10 9 10M80 24l9 10-9 10M74 20l-6 28"></path></svg></sc-if>
</button>
</sc-if>
</sc-for>

<div class="side hatch" style="grid-column: 1; grid-row: 2; border-right: 1px dashed #C3C9D3; border-bottom: 1px dashed #C3C9D3"></div>
<div class="side" style="grid-column: 1; grid-row: 4; border-right: 1px dashed #C3C9D3"></div>
<div class="side hatch" style="grid-column: 5; grid-row: 1; border-left: 1px dashed #C3C9D3; border-bottom: 1px dashed #C3C9D3"></div>
<div class="side" style="grid-column: 5; grid-row: 3; border-left: 1px dashed #C3C9D3; border-bottom: 1px dashed #C3C9D3"></div>

<sc-for list="{{ segs }}" as="s" hint-placeholder-count="12">
<div class="conn cf" aria-hidden="true" style="left: {{ s.l }}; right: {{ s.r }}; top: {{ s.t }}; width: {{ s.w }}; height: {{ s.h }}; background-image: {{ s.bg }}; transform-origin: {{ s.org }}; animation: {{ s.anim }}; z-index: {{ s.z }}"></div>
</sc-for>

<div class="center">
<div class="headbox" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; gap: 22px; padding: 0 12px 36px; height: 300px">
<h1 class="serif h1fit rise d2" style="font-family: {{ serif }}; font-weight: {{ serifWeight }}; font-variation-settings: {{ serifVar }}; letter-spacing: {{ serifTrack }}; margin: 0; line-height: 1.08; max-width: 620px">I design for what’s<br>used once, used all day.</h1>
<p class="rise d3" style="margin: 0; font-size: 17px; color: var(--muted)">Product designer in Berlin. B2B SaaS, mobile and AI prototyping.</p>
</div>
<div class="sbox rise d4" onClick="{{ stop }}" style="width: 100%; max-width: 640px; margin: 0 auto; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; box-shadow: 0 12px 32px rgba(20,27,45,0.09); position: relative; z-index: 3; overflow: visible; transition: box-shadow .3s">
<div style="display: flex; align-items: center; gap: 12px; padding: 18px 22px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6475" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input class="qin" type="search" aria-label="Search my work" placeholder="Search my work…" value="{{ query }}" onChange="{{ onQuery }}" style="flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font-family: inherit; font-size: 18px; color: var(--ink); min-height: 44px">
</div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 18px 16px 22px">
<button type="button" class="chip" onClick="{{ browseAll }}" style="font-family: inherit; font-size: 14px; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #E3E6EB; background: #FFFFFF; color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 8px">
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3A4560" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
Browse all</button>
<button type="button" aria-label="Search" onClick="{{ stop }}" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: {{ goBg }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .3s">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg>
</button>
</div>
<sc-if value="{{ showList }}" hint-placeholder-val="{{ false }}">
<div class="swap" ref="{{ setDrop }}" style="position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 30; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 16px; box-shadow: 0 24px 60px rgba(17,24,47,0.16); padding-bottom: 10px; max-height: 420px; overflow-y: auto; text-align: left">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 22px 8px">
<span style="font-size: 16px; font-weight: 500">{{ listTitle }}</span>
<button type="button" onClick="{{ reset }}" style="font-family: inherit; font-size: 14px; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #E3E6EB; background: #FFFFFF; color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 8px"><span aria-hidden="true">←</span> All categories</button>
</div>
<sc-if value="{{ hasCases }}" hint-placeholder-val="{{ true }}">
<span class="mono" style="display: block; padding: 10px 22px 4px; font-size: 10px; color: #6A7385">Case studies</span>
<sc-for list="{{ caseResults }}" as="r" hint-placeholder-count="2">
<a class="res" href="{{ r.href }}" style="display: flex; align-items: center; gap: 16px; padding: 10px 22px; text-decoration: none; color: var(--ink)">
<img src="{{ r.img }}" alt="" style="flex: 0 0 64px; width: 64px; height: 40px; border-radius: 6px; object-fit: cover; display: block; border: 1px solid #E3E6EB">
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 500">{{ r.title }}</span>
<span class="mono" style="font-size: 10px; color: var(--muted)">{{ r.num }} · {{ r.meta }}</span>
</span>
<span class="arrow" aria-hidden="true" style="font-size: 16px">→</span>
</a>
</sc-for>
</sc-if>
<sc-if value="{{ hasGallery }}" hint-placeholder-val="{{ false }}">
<span class="mono" style="display: block; padding: 14px 22px 4px; font-size: 10px; color: #6A7385">Gallery</span>
<sc-for list="{{ galleryResults }}" as="r" hint-placeholder-count="1">
<a class="res" href="#beyond" style="display: flex; align-items: center; gap: 16px; padding: 10px 22px; text-decoration: none; color: var(--ink)">
<img src="{{ r.img }}" alt="" style="flex: 0 0 48px; width: 48px; height: 48px; border-radius: 6px; object-fit: cover; display: block; border: 1px solid #E3E6EB">
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 500">{{ r.title }}</span>
<span class="mono" style="font-size: 10px; color: var(--muted)">{{ r.desc }} · {{ r.meta }}</span>
</span>
<span class="arrow" aria-hidden="true" style="font-size: 16px">→</span>
</a>
</sc-for>
</sc-if>
<sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 10px 22px 8px; font-size: 15px; color: var(--muted)">Nothing matches yet. Try B2B SaaS or Mobile UI.</p>
</sc-if>
</div>
</sc-if>
</div>
<sc-if value="{{ showChips }}" hint-placeholder-val="{{ true }}">
<div class="rise d4" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; max-width: 760px; margin-left: auto; margin-right: auto">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
<button type="button" class="chip" onClick="{{ c.pick }}" style="font-family: inherit; font-size: 14px; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #E3E6EB; background: #FFFFFF; color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 18px rgba(20,27,45,0.06)"><sc-if value="{{ c.ic_grid }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6475" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 9h18M9 9v11"></path></svg></sc-if><sc-if value="{{ c.ic_phone }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6475" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M11 18h2"></path></svg></sc-if><sc-if value="{{ c.ic_sliders }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6475" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></sc-if><sc-if value="{{ c.ic_spark }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6475" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"></path></svg></sc-if><sc-if value="{{ c.ic_chart }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6475" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></sc-if><span>{{ c.label }}</span></button>
</sc-for>
</div>
</sc-if>
</div>
</section>

<section id="principles" class="bp {{ bpClass }}" ref="{{ setBp }}" style="border-top: 1px dashed var(--frame)">
<div style="padding: 80px 32px 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px">
<span class="mono" style="font-size: 11px; color: var(--muted)">Approach · Sheets 01–03</span>
<h2 class="serif" style="font-family: {{ serif }}; font-weight: {{ serifWeight }}; font-variation-settings: {{ serifVar }}; letter-spacing: {{ serifTrack }}; margin: 0; font-size: clamp(28px, 3vw, 38px); line-height: 1.1">Principles that guide my work.</h2>
</div>
